<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CHRONO — a polished daily historical puzzle game." />
    <title>CHRONO</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
  </head>
  <body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">C</div>
          <div>
            <div class="brand-name">CHRONO</div>
            <div class="brand-tag">Historical daily puzzles</div>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-button active" data-view="today" type="button">Today</button>
          <button class="nav-button" data-view="krillion" type="button">Krillion</button>
          <button class="nav-button" data-view="noillirk" type="button">Noillirk</button>
          <button class="nav-button" data-view="beforeafter" type="button">Before / After</button>
          <button class="nav-button" data-view="discover" type="button">Discover</button>
          <button class="nav-button" data-view="stats" type="button">Stats</button>
        </nav>
      </header>

      <main id="app" aria-live="polite"></main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
